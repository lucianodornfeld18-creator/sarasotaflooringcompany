<svg viewBox="0 0 300 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sarasota Flooring Company">
  <!-- Icon: top-down floor plank stagger pattern on emerald background -->
  <rect width="64" height="64" rx="10" fill="#1F5F3F"/>

  <!-- Row 1: full plank -->
  <rect x="7" y="9"  width="50" height="10" rx="2" fill="#C8893D"/>
  <!-- Row 2: staggered — short left, gap, long right -->
  <rect x="7" y="21" width="18" height="10" rx="2" fill="#F0B96A"/>
  <rect x="29" y="21" width="28" height="10" rx="2" fill="#C8893D"/>
  <!-- Row 3: full plank, slightly lighter -->
  <rect x="7" y="33" width="50" height="10" rx="2" fill="#D9A258"/>
  <!-- Row 4: staggered — long left, gap, short right -->
  <rect x="7" y="45" width="32" height="10" rx="2" fill="#C8893D"/>
  <rect x="43" y="45" width="14" height="10" rx="2" fill="#F0B96A"/>

  <!-- Wordmark -->
  <!-- "SARASOTA" — heavy, emerald -->
  <text x="78" y="26"
    font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
    font-weight="800"
    font-size="22"
    fill="#1F5F3F"
    letter-spacing="-0.4">SARASOTA</text>

  <!-- "FLOORING COMPANY" — medium, warm gray -->
  <text x="79" y="46"
    font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif"
    font-weight="500"
    font-size="13"
    fill="#5E6362"
    letter-spacing="3.2">FLOORING COMPANY</text>

  <!-- Caramel underline accent under wordmark -->
  <rect x="79" y="51" width="198" height="2.5" rx="1.25" fill="#C8893D" opacity="0.7"/>
</svg>
